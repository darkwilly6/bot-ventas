<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot de Ventas · Panel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="card login-card">
      <div class="brand-big">💬</div>
      <h1>Bot de Ventas</h1>
      <p class="muted">Ingresá la contraseña del panel</p>
      <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required />
      <button class="btn primary" type="submit">Entrar</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span>💬</span><b id="brandName">Bot de Ventas</b></div>
      <nav id="nav">
        <a href="#inicio" data-view="inicio">🏠 <span>Inicio</span></a>
        <a href="#chats" data-view="chats">💬 <span>Chats</span><i class="badge" id="badgeChats"></i></a>
        <a href="#pedidos" data-view="pedidos">📦 <span>Pedidos</span><i class="badge" id="badgeOrders"></i></a>
        <a href="#catalogo" data-view="catalogo">🗂️ <span>Catálogo</span></a>
        <a href="#simulador" data-view="simulador">🧪 <span>Probar</span></a>
        <a href="#config" data-view="config">⚙️ <span>Ajustes</span></a>
      </nav>
      <button class="btn ghost small logout" id="logoutBtn">Salir</button>
    </aside>
    <main id="main"></main>
    <button class="bell" id="bellBtn" title="Notificaciones">🔔<i class="badge" id="badgeBell"></i></button>
    <div class="drawer hidden" id="drawer">
      <div class="drawer-head"><b>Notificaciones</b><span><button class="btn small ghost" id="readAllBtn">Marcar leídas</button><button class="btn small ghost" id="closeDrawer">✕</button></span></div>
      <div id="notifList"></div>
    </div>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
